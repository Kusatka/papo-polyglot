<!doctype html><html><head><meta charset="utf-8"><style>body{margin:16px;background:#fff} #d .nodeLabel, #d .label div, #d foreignObject div {white-space:nowrap !important; max-width:none !important}</style></head><body>
<div id="d"></div><script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
mermaid.initialize({startOnLoad:false, theme:"neutral", securityLevel:"loose", fontFamily:"Arial",
  themeVariables:{fontSize:"15px"}, er:{useMaxWidth:false, fontSize:14}, flowchart:{useMaxWidth:false, htmlLabels:true, padding:12, wrappingWidth:600}, markdownAutoWrap:false});
const {svg} = await mermaid.render("g", "flowchart LR\n    PG[(\"<b>PostgreSQL — master</b><br/>источник истины, ACID<br/>все 13 таблиц:<br/>universities · institutes · departments<br/>specialties · department_specialties<br/>lecture_courses · lectures · lecture_materials<br/>student_groups · students · student_electives<br/>schedule · attendance (20 недельных партиций)\")]\n\n    R[\"<b>Redis — кэш</b> (база №2)<br/>student:{id} — Hash, TTL 2 ч<br/>schedule:{group}:{date} — Hash, TTL 1 ч<br/>today_schedule:{group} — List, до конца дня<br/>attendance:{schedule} — Hash, TTL 30 мин<br/>session:{user} — String JSON, TTL 24 ч\"]\n    N[\"<b>Neo4j — граф</b><br/>University → Institute → Department<br/>→ Specialty → LectureCourse<br/>Specialty → Group ← Student<br/>Student –CHOSE→ LectureCourse<br/>Department –TEACHES→ LectureCourse\"]\n    M[\"<b>MongoDB — документы</b><br/>lecture_materials: агрегат материалов занятия<br/>(текст, слайды, код, упражнения)<br/>student_groups: группа с составом\"]\n    E[\"<b>Elasticsearch — полнотекст</b><br/>индекс lectures: title, annotation,<br/>content_text, tech_requirements<br/>(russian_custom) + метаданные keyword:<br/>lecture_type, tags, specialty_code\"]\n\n    PG -- \"дубль: карточки студентов,<br/>расписание групп,<br/>текущие отметки\" --> R\n    PG -- \"дубль: иерархия, группы,<br/>студенты, выбор курсов\" --> N\n    PG -- \"дубль: материалы занятий<br/>как один документ\" --> M\n    PG -- \"дубль: тексты и аннотации<br/>для поиска\" --> E\n");
document.getElementById("d").innerHTML = svg; document.body.dataset.done = "1";
</script></body></html>
