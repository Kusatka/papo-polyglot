<!doctype html><html><head><meta charset="utf-8"><style>body{margin:16px;background:#fff} #d .nodeLabel, #d .label div, #d foreignObject div {white-space:nowrap !important; max-width:none !important}</style></head><body>
<div id="d"></div><script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
mermaid.initialize({startOnLoad:false, theme:"neutral", securityLevel:"loose", fontFamily:"Arial",
  themeVariables:{fontSize:"15px"}, er:{useMaxWidth:false, fontSize:14}, flowchart:{useMaxWidth:false, htmlLabels:true, padding:12, wrappingWidth:600}, markdownAutoWrap:false});
const {svg} = await mermaid.render("g", "flowchart LR\n    subgraph RD[\"Чтение (read path)\"]\n        direction LR\n        U2([\"Клиент\"]) --> API2[\"API-сервер\"]\n        API2 -- \"расписание на сегодня<br/>(cache-aside)\" --> RR[(\"Redis\")]\n        RR -. \"промах кэша:<br/>чтение и запись в кэш\" .-> PGR[(\"PostgreSQL\")]\n        API2 -- \"поиск по текстам лекций\" --> ER[(\"Elasticsearch\")]\n        API2 -- \"навигация по иерархии,<br/>слушатели курса\" --> NR[(\"Neo4j\")]\n        API2 -- \"страница занятия<br/>со всеми материалами\" --> MR[(\"MongoDB\")]\n        API2 -- \"отчёты, агрегаты,<br/>редактирование\" --> PGR\n        API2 -- \"отметка посещаемости:<br/>буфер → фоновая запись\" --> RR\n    end\n    subgraph W[\"Запись (write path)\"]\n        direction LR\n        U1([\"Пользователь /<br/>администратор\"]) --> API1[\"API-сервер\"]\n        API1 -- \"INSERT / UPDATE / DELETE<br/>(все записи)\" --> PGW[(\"PostgreSQL<br/>master\")]\n        PGW -- \"журнал WAL\" --> CDC[\"CDC: Debezium<br/>→ Apache Kafka<br/>(ЛР №4–6)\"]\n        CDC -- \"sink\" --> RW[(\"Redis\")]\n        CDC -- \"sink\" --> NW[(\"Neo4j\")]\n        CDC -- \"sink\" --> MW[(\"MongoDB\")]\n        CDC -- \"sink\" --> EW[(\"Elasticsearch\")]\n    end\n");
document.getElementById("d").innerHTML = svg; document.body.dataset.done = "1";
</script></body></html>
